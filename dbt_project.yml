name: 'analytics'
version: '1.0.0'
profile: 'default'

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages"]

vars:
  raw_volume: '/Volumes/workspace/gtfs/raw'

models:
  analytics:              # must match `name:` above
    +persist_docs:
      relation: true
      columns: true
    bronze:
      +materialized: table
    staging:
      +materialized: view
    marts:
      +materialized: table

seeds:
  analytics:
    +column_types:
      motorway_id: int
